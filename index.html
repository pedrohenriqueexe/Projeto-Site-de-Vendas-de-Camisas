<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IGOR IMPØRTS | EXCLUSIVE JERSEYS</title>
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div id="loader">
        <div class="glitch-logo">IGOR IMPØRTS</div>
        <div class="loading-bar"><div class="progress"></div></div>

    <div class="tech-grid-bg"></div>

    <div id="main-content" style="display: none;">
        <header class="glass-header">
            <img src="logo.png" alt="Logo" class="main-logo-img">
        </header>

        <nav class="tech-categories">
            <button class="cat-btn active" data-filter="all">TODAS</button>
            <button class="cat-btn" data-filter="brasil">BRASIL</button>
            <button class="cat-btn" data-filter="europa">EUROPA</button>
            <button class="cat-btn" data-filter="retro">RETRÔ</button>
        </nav>

        <main class="product-container" id="catalog"></main>

        <footer class="bottom-nav">
            <a href="#" class="active"><i class="fas fa-home"></i><span>HOME</span></a>
            <a href="#"><i class="fas fa-search"></i><span>BUSCA</span></a>
            <a href="#"><i class="fab fa-whatsapp"></i><span>PEDIDOS</span></a>
        </footer>
    </div>

    <script src="script.js"></script>

</html>
